<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE VOID — مكتبة المعرفة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/void.css" />
</head>
<body>
  <canvas id="nebula"></canvas>

  <nav class="v-nav">
    <div class="v-nav-inner">
      <a href="index.html" class="v-brand">
        <svg class="sigil" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><circle cx="13" cy="13" r="12"/><circle cx="13" cy="13" r="6"/><path d="M13 1 L13 25 M1 13 L25 13"/></svg>
        THE VOID
      </a>
      <button class="v-nav-toggle" aria-label="القائمة">&#9776;</button>
      <div class="v-nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="library.html">المكتبة</a>
        <a href="path.html">مسار الصعود</a>
        <a href="admin/login.html">الإدارة</a>
      </div>
      <button id="langToggle" class="v-btn" style="padding:6px 12px;font-size:0.7rem;">EN</button>
    </div>
  </nav>

  <main class="v-section">
    <div class="v-container">
      <span class="v-eyebrow v-mono">محرك المعرفة</span>
      <h1>المكتبة.</h1>
      <p style="max-width:720px;color:var(--v-text-muted);margin-bottom:32px;">
        أحد عشر مجالاً للعقل. مقالات أصلية، تطبيقات عملية، مراجع قابلة للتحقق.
      </p>

      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;align-items:center;">
        <div class="v-search-wrap">
          <span class="v-search-icon">&#128269;</span>
          <input class="v-input" id="searchInput" placeholder="ابحث في المقالات والمواضيع..." />
        </div>
        <select class="v-select" id="catFilter" style="max-width:260px;">
          <option value="">كل التصنيفات</option>
        </select>
        <select class="v-select" id="stageFilter" style="max-width:200px;">
          <option value="">كل المراحل</option>
        </select>
        <label class="v-chip" style="cursor:pointer;"><input type="checkbox" id="favOnly" style="display:none;" /> المفضلة فقط</label>
      </div>

      <div id="catChips" style="margin-bottom:24px;"></div>

      <div id="articleGrid" class="v-grid v-grid-3"></div>
      <div id="emptyState" class="v-empty" style="display:none;">لا توجد مقالات تطابق بحثك.</div>
    </div>
  </main>

  <footer class="v-footer">
    <div class="v-container"><p>THE VOID &mdash; المعرفة ليست قوة. المعرفة المطبقة هي القوة.</p></div>
  </footer>

  <div class="v-settings">
    <button aria-label="الإعدادات">&#9881;</button>
    <div class="v-settings-panel">
      <label>تقليل الحركة <input type="checkbox" data-setting="reduceMotion" /></label>
      <label>الصوت <input type="checkbox" data-setting="sound" /></label>
    </div>
  </div>
  <div class="v-toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/void-core.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
